# ======================================================
# Pin definitions (see planning/Pinout.md for the authoritative
# pad-by-pad description; 26 signal + 2 power pads = 28, the full
# allocation with no spare slot remaining.
# VDD_IO removed 2026-08-19: the reference padring ties VDD_CORE/VDD_IO
# to one net by default (no independent IO rail is actually built), so
# there is one supply pin (VDD), not two. VSS added 2026-08-23 — the
# padring now requires a per-project VSS pin (previously GND/VSS was
# shared die-wide and not a per-project pin) — see planning/Pinout.md.)
#
# LIST ORDER IS LOAD-BEARING. The A40 integrator tooling wraps this list
# around Trouper's NW-corner arc in order: the first 11 entries
# (VSS .. RESETB) land on the West edge bottom->top (A40 slots W12-W22),
# the next 14 (REMOD_A_I .. VDD) on the North edge left->right (N01-N14).
# This order is P&R-validated: job 5150 built trouper_top against the
# integrator's A40_ACV.def generated from exactly this order and closed
# DRC-clean / XOR-0 / max_ss -12.26 ns (= the signed-off rect baseline).
#
# ARRAY_ACQ_N is appended AFTER VDD deliberately, so it takes the next free
# slot (N15) and every pin above keeps its validated slot. Do not move it
# before VDD to "group the signals": VSS(W12) and VDD(N14) are the slots the
# shared padring reserves for power, and the integrator may yet require the
# macro to declare them at exactly those positions
# (planning/a40-padframe-integration-2026-08.md, VDD/VSS decision 2026-08-29).
# The ACV allocation is 28 slots (confirmed 2026-08-30). ARRAY_ACQ_N takes
# N15 and DBG0_OUT/DBG1_OUT take N16/N17, which fills the allocation
# exactly -- there is no spare slot left for a late addition. Still
# outstanding before these three pins are committed: a regenerated
# A40_ACV.def and a P&R run against the full 28-pin list, plus the
# pad-level electrical review. See Open Risks #52 and #53.
# The Grouper bus (GRP_*, AHB H*, IRQ_GROUPER) was die-internal rather than
# pads, so it was always absent here; it was removed from trouper_top.v
# entirely on 2026-09-01 because Grouper is not taping out. See
# planning/a40-padframe-integration-2026-08.md before reordering.
# ======================================================
pins:
  - name: VSS
    io_type: ground

  - name: IQ_DATA_I_0
    io_type: input_cmos
  - name: IQ_DATA_Q_0
    io_type: input_cmos
  - name: IQ_DATA_I_1
    io_type: input_cmos
  - name: IQ_DATA_Q_1
    io_type: input_cmos
  - name: IQ_DATA_I_2
    io_type: input_cmos
  - name: IQ_DATA_Q_2
    io_type: input_cmos
  - name: IQ_DATA_I_3
    io_type: input_cmos
  - name: IQ_DATA_Q_3
    io_type: input_cmos

  - name: IQ_CLK
    io_type: input_cmos
  - name: RESETB
    io_type: input_schmitt

  - name: REMOD_A_I
    io_type: bidirectional
  - name: REMOD_A_Q
    io_type: bidirectional

  - name: PSRAM_SCK
    io_type: bidirectional_24ma
  - name: PSRAM_CE_N
    io_type: bidirectional
  - name: PSRAM_SIO_0
    io_type: bidirectional
  - name: PSRAM_SIO_1
    io_type: bidirectional
  - name: PSRAM_SIO_2
    io_type: bidirectional
  - name: PSRAM_SIO_3
    io_type: bidirectional

  - name: HOST_CS
    io_type: input_schmitt
  - name: SPI_SCK
    io_type: input_schmitt
  - name: SPI_MOSI
    io_type: input_schmitt
  - name: SPI_MISO
    io_type: bidirectional

  - name: IRQ_OUT
    io_type: bidirectional

  - name: VDD
    io_type: power

  # Multi-ASIC acquisition-sync wire (planning/array-acquisition-sync.md).
  # bi_t, not bi_24t: the core drives PDRV[1:0]=00 (4 mA), which is ample to
  # sink a board pull-up and keeps the falling edge slow on a shared net.
  - name: ARRAY_ACQ_N
    io_type: bidirectional

  # Two-pin digital debug probes (planning/two-pin-digital-debug-plan.md).
  # Output-only in function, but bi_t like every other output on the A40
  # padframe, which has no output-only cell. These two take the allocation to
  # 28 of 28 -- FULL, no spare slot remains.
  - name: DBG0_OUT
    io_type: bidirectional
  - name: DBG1_OUT
    io_type: bidirectional
